name: Lexa Medical Lab Testing

on:
  push:
    branches: [main]

permissions:
  contents: write        # allows repository-dispatch
  actions: write


jobs:
    test: 
        runs-on: ubuntu-latest

        services:
            mysql: 
                image: mysql:8.0
                env: 
                    MYSQL_ROOT_PASSWORD: password
                    MYSQL_DATABASE: test_db
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

        steps:
            - uses: actions/checkout@v3

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                php-version: '8.2'
                extensions: >
                    mbstring,
                    curl,
                    openssl,
                    json,
                    xml,
                    fileinfo,
                    pdo,
                    pdo_mysql,
                    bcmath,
                    tokenizer,
                    ctype
                coverage: xdebug


            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '22'
                cache: 'npm'

            - name: Copy .env
              run: php -r "file_exists('.env') || copy('.env.example', '.env');"

            - name: Update .env for CI database
              run: |
                sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
                sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
                sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
                sed -i 's/DB_DATABASE=.*/DB_DATABASE=test_db/' .env
                sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
                sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=password/' .env

            - name: Install PHP Dependencies
              run: composer install --prefer-dist --no-progress --no-suggest

            - name: Generate Application Key
              run: php artisan key:generate


            - name: Wait for MySQL to be ready
              run: |
                for i in {1..10}; do
                  mysqladmin ping -h127.0.0.1 -uroot -ppassword --silent && break
                  echo "Waiting for MySQL... ($i)"
                  sleep 5
                done

            - name: Run migrations
              run: php artisan migrate --force

            
            - name: Run test
              run: php artisan test --stop-on-failure

           
            - name: Install NPM Dependencies
              if: ${{ success() }}
              run: npm ci
              
            - name: Build Vue Assets
              if: ${{ success() }}
              run: npm run build


            - name: Trigger build workflow on successful test
              if: ${{ success() }}
              uses: peter-evans/repository-dispatch@v3
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                event-type: trigger-build