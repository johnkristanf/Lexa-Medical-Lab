name: Lexa Medical Laboratory Deployment
on:
    push:
        branches: [production]

jobs:

    build:
      runs-on: ubuntu-latest

      steps:
          - uses: actions/checkout@v4

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3


          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PERSONAL_ACCESS_TOKEN }}


          - name: Build and push image
            uses: docker/build-push-action@v5
            with:
              context: .                # directory to build from (can be ./server, etc.)
              file: ./Dockerfile        # specify Dockerfile path
              push: true                # actually push to Docker Hub
              tags: johnkristan/lexa-medical-laboratory:latest

    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create Production Env
              run: |
                cat <<'EOF' > .env.production
                    APP_NAME="Lexa Medical Laboratory"
                    APP_KEY=${{ secrets.APP_KEY }}
                    APP_URL=https://lexa-medical-laboratory.it.com

                    APP_TIMEZONE="Asia/Manila"
                    APP_ENV=production
                    APP_DEBUG=false

                    DB_CONNECTION=${{ secrets.DB_CONNECTION }}
                    DB_HOST=${{ secrets.DB_HOST }}
                    DB_PORT=${{ secrets.DB_PORT }}
                    DB_DATABASE=${{ secrets.DB_DATABASE }}
                    DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                    DB_USERNAME=${{ secrets.DB_USERNAME }}

                    DB_ROOT_PASSWORD=${{ secrets.ROOT_PASSWORD }}

                    MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
                    MYSQL_DATABASE: ${DB_DATABASE}
                    MYSQL_USER: ${DB_USERNAME}
                    MYSQL_PASSWORD: ${DB_PASSWORD}

                    LOG_CHANNEL=stack
                    LOG_LEVEL=error

                    SESSION_DRIVER=database
                    SESSION_SAME_SITE=None
                    SESSION_SECURE_COOKIE=true

                    BROADCAST_CONNECTION=pusher
                    PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}
                    PUSHER_APP_KEY=${{ secrets.PUSHER_APP_KEY }}
                    PUSHER_APP_SECRET=${{ secrets.PUSHER_APP_SECRET }}
                    PUSHER_SCHEME="https"
                    PUSHER_APP_CLUSTER="ap1"


                    VITE_APP_NAME=${APP_NAME}
                    VITE_PUSHER_APP_KEY=${PUSHER_APP_KEY}
                    VITE_PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER}
                    VITE_PUSHER_SCHEME=${PUSHER_SCHEME}


                    MAIL_MAILER=smtp
                    MAIL_HOST=smtp.gmail.com
                    MAIL_PORT=587
                    MAIL_ENCRYPTION=tls
                    MAIL_FROM_NAME="${APP_NAME}"
                    EMAIL_VERIFICATION_URL="${APP_URL}/email/verified"

                    MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
                    MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
                    MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}

                    SENTRY_LARAVEL_DSN=${{ secrets.SENTRY_LARAVEL_DSN }}
                    SENTRY_TRACES_SAMPLE_RATE=${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}
                EOF


            - name: 🚀 Deploy on EC2 via SSH
              uses: appleboy/ssh-action@v1.0.2
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_KEY }}
                script: |
                    set -e

                    echo "📄 Checking Files inside EC2"
                    ls -lah

                    echo "📄 Viewing .env"
                    cat .env

                    echo "🔐 Logging into Docker Hub..."
                    echo "${{ secrets.DOCKER_PERSONAL_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

                    echo "Stopping old containers..."
                    docker compose down || true

                    echo "Pulling latest images..."
                    docker compose pull

                    echo "Starting containers..."
                    docker compose --env-file .env.production up -d --remove-orphans





