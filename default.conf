# ----------------------------------------
# HTTP → HTTPS redirect
# ----------------------------------------
server {
    listen 80;
    server_name lexa-medical-laboratory.it.com www.lexa-medical-laboratory.it.com;

    return 301 https://$host$request_uri;
}

# ----------------------------------------
# HTTPS server
# ----------------------------------------
server {
    listen 443 ssl http2;
    server_name lexa-medical-laboratory.it.com www.lexa-medical-laboratory.it.com;

    ssl_certificate     /etc/letsencrypt/live/lexa-medical-laboratory.it.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexa-medical-laboratory.it.com/privkey.pem;

    root /var/www/public;
    index index.php;

    # ----------------------------------------
    # Inertia / Laravel routing
    # ----------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ----------------------------------------
    # PHP handling
    # ----------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_param HTTP_X_FORWARDED_FOR  $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
    }

    # ----------------------------------------
    # Static assets (optional but recommended)
    # ----------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------
    # Security
    # ----------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
