services:
    app:
        image: johnkristan/lexa-medical-laboratory:latest
        container_name: lexa_medical_laboratory
        restart: always
        ports:
            - '9000:9000'
        env_file:
            - .env.production
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: always
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./default.conf:/etc/nginx/conf.d/default.conf
            - letsencrypt:/etc/letsencrypt
            - ./www:/var/www/certbot
        networks:
            - app-network


    certbot:
        image: certbot/certbot
        container_name: certbot
        volumes:
            - letsencrypt:/etc/letsencrypt
            - ./www:/var/www/certbot
        entrypoint: >
            /bin/sh -c "
            certbot certonly --webroot -w /var/www/certbot
            -d api.jarvis-designs.it.com
            --email your-email@example.com
            --agree-tos --non-interactive
            "


    db:
        image: mysql:8.0
        container_name: lexa_medical_database
        restart: always
        env_file:
            - .env.production
        volumes:
            - database:/var/lib/mysql
        networks:
            - app-network

volumes:
    database:

networks:
    app-network:
        driver: bridge
