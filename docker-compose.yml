services:
    app:
        image: johnkristan/lexa-medical-laboratory:latest
        container_name: lexa_medical_laboratory
        restart: always
        ports:
            - '9000:9000'
        env_file:
            - .env.production
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: always
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./default.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt/live/api.jarvis-designs.it.com:/etc/letsencrypt/live/api.jarvis-designs.it.com
            - /etc/letsencrypt/archive/api.jarvis-designs.it.com:/etc/letsencrypt/archive/api.jarvis-designs.it.com
        networks:
            - app-network

    db:
        image: mysql:8.0
        container_name: lexa_medical_database
        restart: always
        env_file:
            - .env.production
        volumes:
            - database:/var/lib/mysql
        networks:
            - app-network

volumes:
    database:

networks:
    app-network:
        driver: bridge
