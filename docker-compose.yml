services:
    app:
        image: johnkristan/lexa-medical-laboratory:latest
        container_name: lexa_medical_laboratory
        restart: always
        ports:
            - '9000:9000'
        env_file:
            - .env.production
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: always
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - /etc/letsencrypt/live/lexa-medical-laboratory.it.com:/etc/letsencrypt/live/lexa-medical-laboratory.it.com:ro
            - /etc/letsencrypt/archive/lexa-medical-laboratory.it.com:/etc/letsencrypt/archive/lexa-medical-laboratory.it.com:ro
            - ./default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
